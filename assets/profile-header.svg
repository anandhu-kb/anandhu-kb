<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b0f"/>
    <stop offset="0.55" stop-color="#0b1117"/>
    <stop offset="1" stop-color="#061014"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#36f1a1"/>
    <stop offset="1" stop-color="#58d9ff"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#7ee7c4" stroke-opacity=".055"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="358" rx="17" fill="url(#grid)" stroke="#24313b"/>

<rect x="38" y="34" width="8" height="292" rx="4" fill="url(#accent)" filter="url(#glow)"/>

<text x="78" y="86" fill="#7b8a96" font-family="monospace" font-size="16" letter-spacing="4">PROFILE / SECURITY ENGINEERING</text>

<text x="78" y="148" fill="#f3f7f8" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">ANANDHU KB</text>

<text x="80" y="184" fill="#36f1a1" font-family="monospace" font-size="18">CYBERSECURITY  •  SOFTWARE  •  SYSTEMS</text>

<line x1="80" y1="218" x2="1120" y2="218" stroke="#25333d"/>

<text x="80" y="260" fill="#d7e0e5" font-family="monospace" font-size="17">BUILD  →  BREAK  →  IMPROVE</text>

